<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden Test Results</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-elevated: #1a1a24;
            --border: #2a2a3a;
            --text: #e4e4eb;
            --text-dim: #8888a0;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff9d;
            --accent-red: #ff4d6a;
            --accent-orange: #ffa64d;
            --accent-purple: #b44dff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(180, 77, 255, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .test-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .test-card.success {
            border-left: 4px solid var(--accent-green);
        }

        .test-card.failure {
            border-left: 4px solid var(--accent-red);
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .test-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .test-icon {
            font-size: 1.5rem;
        }

        .success .test-icon {
            color: var(--accent-green);
        }

        .failure .test-icon {
            color: var(--accent-red);
        }

        .test-title h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .test-meta {
            display: flex;
            gap: 0.75rem;
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .badge.expected {
            background: var(--bg-elevated);
            color: var(--text-dim);
        }

        .badge.actual {
            background: var(--bg-elevated);
            color: var(--accent-cyan);
        }

        .test-desc {
            color: var(--text-dim);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .captures-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .cap-label {
            color: var(--accent-purple);
            margin-right: 0.5rem;
        }

        .packets-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .packets-table th {
            background: var(--bg-elevated);
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
        }

        .packets-table th.idx-header,
        .packets-table th.status-header {
            width: 50px;
            text-align: center;
        }

        .packets-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .packets-table tr:last-child td {
            border-bottom: none;
        }

        .packets-table tr.match {
            background: rgba(0, 255, 157, 0.03);
        }

        .packets-table tr.diff {
            background: rgba(255, 77, 106, 0.05);
        }

        .idx {
            text-align: center;
            color: var(--text-dim);
            font-weight: 600;
        }

        .status {
            text-align: center;
            font-size: 1.2rem;
        }

        .match .status {
            color: var(--accent-green);
        }

        .diff .status {
            color: var(--accent-red);
        }

        .pkt {
            background: var(--bg-elevated);
            border-radius: 8px;
            padding: 0.75rem !important;
        }

        .pkt.incoming {
            border-left: 3px solid var(--accent-cyan);
        }

        .pkt.outgoing {
            border-left: 3px solid var(--accent-orange);
        }

        .pkt-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .direction {
            font-size: 1rem;
            font-weight: 700;
        }

        .direction.in {
            color: var(--accent-cyan);
        }

        .direction.out {
            color: var(--accent-orange);
        }

        .endpoints {
            color: var(--text);
            font-size: 0.8rem;
        }

        .pkt-payload {
            color: var(--accent-green);
            word-break: break-all;
            margin-bottom: 0.35rem;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pkt-size {
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .missing {
            text-align: center;
        }

        .missing-label {
            color: var(--accent-red);
            font-style: italic;
            opacity: 0.7;
        }

        .legend {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
            padding: 1rem;
            background: var(--bg-card);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .legend-color.incoming {
            background: var(--accent-cyan);
        }

        .legend-color.outgoing {
            background: var(--accent-orange);
        }

        .legend-color.match {
            background: var(--accent-green);
        }

        .legend-color.diff {
            background: var(--accent-red);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔ Warden Test Results</h1>
            <p class="subtitle">Network Traffic Reproducibility Analysis</p>
        </header>

        

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color incoming"></div>
                <span>Incoming (from server)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color outgoing"></div>
                <span>Outgoing (from client)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color match"></div>
                <span>Packets match</span>
            </div>
            <div class="legend-item">
                <div class="legend-color diff"></div>
                <span>Packets differ</span>
            </div>
        </div>
    </div>
</body>
</html>
