<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerprinting AI Cluster Usage</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            /* Slate 950 */
            color: #e2e8f0;
            /* Slate 200 */
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .packet-animation {
            animation: flow 2s infinite linear;
        }

        @keyframes flow {
            0% {
                transform: translate(0, 0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translate(var(--flow-x, 100%), var(--flow-y, 0));
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icon = ({ size = 20, className, children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Shield = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></Icon>;
        const Server = (p) => <Icon {...p}><rect x="2" y="2" width="20" height="8" rx="2" ry="2" /><rect x="2" y="14" width="20" height="8" rx="2" ry="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></Icon>;
        const Globe = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></Icon>;
        const Eye = (p) => <Icon {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></Icon>;
        const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
        const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></Icon>;
        const RefreshCw = (p) => <Icon {...p}><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></Icon>;
        const CheckCircle = (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></Icon>;
        const AlertTriangle = (p) => <Icon {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
        const Github = (p) => <Icon {...p}><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" /></Icon>;
        const FileText = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></Icon>;

        // --- Layout Components ---

        const Card = ({ title, children, className = "", icon: IconComp }) => (
            <div className={`bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl ${className}`}>
                {title && (
                    <div className="bg-slate-800/50 px-6 py-4 border-b border-slate-800 flex items-center gap-3">
                        {IconComp && <IconComp className="text-emerald-500" />}
                        <h3 className="font-bold text-lg text-slate-100">{title}</h3>
                    </div>
                )}
                <div className="p-6">
                    {children}
                </div>
            </div>
        );

        const Badge = ({ children, type = "default" }) => {
            const colors = {
                default: "bg-slate-800 text-slate-300",
                success: "bg-emerald-900/30 text-emerald-400 border border-emerald-800",
                warning: "bg-amber-900/30 text-amber-400 border border-amber-800",
                danger: "bg-rose-900/30 text-rose-400 border border-rose-800"
            };
            return (
                <span className={`px-2 py-1 rounded text-xs font-mono uppercase tracking-wider ${colors[type]}`}>
                    {children}
                </span>
            );
        };

        // --- Interactive Modules ---

        // 1. Architecture Visualization (Responsive stack)
        const ArchitectureViz = () => {
            const [packets, setPackets] = useState([]);
            const [logs, setLogs] = useState([]);

            const sendPacket = () => {
                const id = Date.now();
                setPackets(prev => [...prev, { id, stage: 0 }]);

                setTimeout(() => updatePacketStage(id, 1), 1000);
                setTimeout(() => {
                    updatePacketStage(id, 2);
                    addLog();
                }, 2000);
                setTimeout(() => updatePacketStage(id, 3), 3000);
                setTimeout(() => removePacket(id), 4000);
            };

            const updatePacketStage = (id, stage) => {
                setPackets(prev => prev.map(p => p.id === id ? { ...p, stage } : p));
            };

            const removePacket = (id) => {
                setPackets(prev => prev.filter(p => p.id !== id));
            };

            const addLog = () => {
                setLogs(prev => [`Hash: ${Math.random().toString(16).substr(2, 8)}...`, ...prev].slice(0, 3));
            };

            return (
                <Card title="Concept: The Border Patrol Architecture" icon={Activity} className="mb-8">
                    <div className="relative flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-8 pt-4 lg:pt-48 pb-12 lg:pb-0">
                        {/* Connection Line - Desktop Horizontal */}
                        <div className="hidden lg:block absolute top-[232px] left-12 right-12 h-1 bg-slate-800 rounded -z-0"></div>
                        {/* Connection Line - Mobile Vertical */}
                        <div className="lg:hidden absolute left-1/2 top-12 bottom-24 w-1 bg-slate-800 rounded -z-0 transform -translate-x-1/2"></div>

                        {/* Nodes */}
                        <div className="flex flex-col items-center z-10">
                            <div className="w-20 h-20 md:w-24 md:h-24 bg-slate-800 rounded-2xl flex items-center justify-center border-2 border-slate-700 shadow-[0_0_20px_rgba(30,41,59,0.5)]">
                                <Server size={32} className="text-blue-400 md:hidden" />
                                <Server size={40} className="text-blue-400 hidden md:block" />
                            </div>
                            <p className="mt-3 font-bold text-slate-200">AI Cluster</p>
                            <p className="text-xs text-slate-500 uppercase">The Prover</p>
                        </div>

                        <div className="flex flex-col items-center relative z-10">
                            {/* Verifier Entity - Fixed responsive overlap */}
                            <div className="absolute -top-4 md:-top-40 lg:-top-40 left-28 lg:left-1/2 lg:-translate-x-1/2 w-36 md:w-44 bg-slate-900 border-2 border-slate-700 p-3 rounded-xl text-[10px] md:text-xs font-mono shadow-2xl z-20">
                                <div className="flex items-center gap-2 mb-2 text-indigo-400 font-bold border-b border-slate-800 pb-1 uppercase tracking-tight">
                                    <Eye size={12} /> The Verifier
                                </div>
                                <div className="text-[9px] md:text-[10px] text-slate-500 mb-2 italic">Evidence Log (H+T)</div>
                                <div className="space-y-1">
                                    {logs.map((l, i) => <div key={i} className="text-emerald-500 opacity-90 truncate">{l}</div>)}
                                    {logs.length === 0 && <span className="opacity-30">Waiting for tap...</span>}
                                </div>
                            </div>

                            {/* Warden Node */}
                            <div className="w-20 h-20 md:w-24 md:h-24 bg-emerald-950/30 rounded-2xl flex items-center justify-center border-2 border-emerald-500/50 shadow-[0_0_30px_rgba(16,185,129,0.2)] relative">
                                <Shield size={32} className="text-emerald-400 md:hidden" />
                                <Shield size={40} className="text-emerald-400 hidden md:block" />
                                {/* Optical Tap Line */}
                                <div className="absolute -top-16 lg:-top-16 lg:left-1/2 left-[120px] lg:translate-x-0 w-16 lg:w-1 h-1 lg:h-16 bg-gradient-to-r lg:bg-gradient-to-t from-emerald-500/50 via-emerald-500/30 to-slate-800/50 border-t lg:border-t-0 lg:border-r border-dashed border-emerald-500/40"></div>
                            </div>
                            <p className="mt-3 font-bold text-emerald-400">Active Warden</p>
                            <p className="text-xs text-emerald-600/70 uppercase text-center leading-tight">Border Patrol Hardware</p>
                        </div>

                        <div className="flex flex-col items-center z-10">
                            <div className="w-20 h-20 md:w-24 md:h-24 bg-slate-800 rounded-2xl flex items-center justify-center border-2 border-slate-700">
                                <Globe size={32} className="text-indigo-400 md:hidden" />
                                <Globe size={40} className="text-indigo-400 hidden md:block" />
                            </div>
                            <p className="mt-3 font-bold text-slate-200">Internet</p>
                            <p className="text-xs text-slate-500 uppercase">Public Users</p>
                        </div>

                        {/* Moving Packets - Logic switches based on lg breakpoint */}
                        {packets.map(p => {
                            const isLg = typeof window !== 'undefined' && window.innerWidth >= 1024;
                            let left = isLg ? '10%' : '50%';
                            let top = isLg ? '232px' : '10%';

                            if (isLg) {
                                if (p.stage === 1) left = '50%';
                                if (p.stage === 2) left = '50%';
                                if (p.stage === 3) left = '90%';
                            } else {
                                if (p.stage === 0) top = '48px';
                                if (p.stage === 1) top = '170px';
                                if (p.stage === 2) top = '170px';
                                if (p.stage === 3) top = '300px';
                            }

                            return (
                                <div
                                    key={p.id}
                                    className="absolute w-3 h-3 md:w-4 md:h-4 bg-white rounded-full shadow-[0_0_15px_white] transition-all duration-1000 ease-linear z-20"
                                    style={{ left, top, transform: 'translateX(-50%) translateY(-50%)' }}
                                />
                            );
                        })}
                    </div>

                    <div className="mt-8 lg:mt-12 flex justify-center">
                        <button
                            onClick={sendPacket}
                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2 shadow-lg shadow-emerald-900/20 active:scale-95 transform duration-100"
                        >
                            <Activity size={18} /> Simulate Traffic Burst
                        </button>
                    </div>
                </Card>
            );
        };

        // 2. Warden Scrubbing Demo
        const WardenScrubber = () => {
            const [isScrubbed, setIsScrubbed] = useState(false);
            const [hoveredField, setHoveredField] = useState(null);

            const packetFields = [
                { id: 'eth', label: 'ETHERNET', val: 'DST: 00:1A...', color: 'bg-slate-700' },
                { id: 'ip_h', label: 'IP HEADER', val: isScrubbed ? 'ID: [RANDOM]' : 'ID: 0x4F2A (Secret?)', color: isScrubbed ? 'bg-emerald-600' : 'bg-rose-600', tooltip: 'The Warden randomizes IP IDs to prevent steganography.' },
                { id: 'tcp', label: 'TCP SEQ', val: isScrubbed ? 'SEQ: [OFFSET]' : 'SEQ: 0x9912 (Secret?)', color: isScrubbed ? 'bg-emerald-600' : 'bg-rose-600', tooltip: 'Initial Sequence Numbers are offset to hide data.' },
                { id: 'pay', label: 'PAYLOAD', val: '{"token": "AI"}', color: 'bg-blue-600', tooltip: 'Payloads are hashed for verification but passed through intact.' },
                { id: 'pad', label: 'PADDING', val: isScrubbed ? 'ZEROS' : 'JUNK/DATA', color: isScrubbed ? 'bg-slate-600' : 'bg-rose-500', tooltip: 'Padding is zeroed out.' },
            ];

            return (
                <Card title="Microarchitecture: The Active Warden" icon={Lock} className="mb-8">
                    <div className="flex flex-col xl:flex-row items-center gap-8 justify-between">
                        <div className="w-full flex-1 space-y-4">
                            <p className="text-slate-400 text-sm leading-relaxed">
                                The Warden acts as a sanitizing gateway. It takes "dirty" packets (potentially containing steganography in headers) and "scrubs" them.
                                Hover over the packet fields below to see what happens.
                            </p>

                            <div className="flex items-center gap-1 bg-black/40 p-3 md:p-4 rounded-xl border border-slate-800 overflow-x-auto no-scrollbar">
                                {packetFields.map(field => (
                                    <div
                                        key={field.id}
                                        onMouseEnter={() => setHoveredField(field)}
                                        onMouseLeave={() => setHoveredField(null)}
                                        className={`flex-shrink-0 min-w-[100px] md:min-w-[120px] h-16 md:h-20 ${field.color} rounded-lg flex flex-col items-center justify-center p-2 cursor-help transition-all duration-300 ${hoveredField?.id === field.id ? 'scale-105 ring-2 ring-white' : 'opacity-90'}`}
                                    >
                                        <span className="text-[9px] md:text-[10px] font-bold opacity-70 mb-1">{field.label}</span>
                                        <span className="text-[10px] md:text-xs font-mono text-center leading-tight">{field.val}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="h-10 md:h-12 flex items-center">
                                {hoveredField ? (
                                    <div className="flex items-center gap-2 text-[11px] md:text-sm text-emerald-400 fade-in bg-emerald-950/30 px-3 py-2 rounded border border-emerald-900/50">
                                        <Shield size={14} className="md:w-4 md:h-4" /> {hoveredField.tooltip}
                                    </div>
                                ) : (
                                    <span className="text-slate-600 text-xs md:text-sm italic">Hover packet segments for details...</span>
                                )}
                            </div>
                        </div>

                        <div className="w-full xl:w-auto flex flex-row xl:flex-col items-center justify-center gap-4 border-t xl:border-t-0 xl:border-l border-slate-800 pt-6 xl:pt-0 xl:pl-8">
                            <div className={`w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center transition-all duration-500 ${isScrubbed ? 'bg-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.4)]' : 'bg-slate-700'}`}>
                                <RefreshCw size={24} className={`text-white transition-transform duration-700 md:hidden ${isScrubbed ? 'rotate-180' : ''}`} />
                                <RefreshCw size={32} className={`text-white transition-transform duration-700 hidden md:block ${isScrubbed ? 'rotate-180' : ''}`} />
                            </div>
                            <div className="flex flex-col items-start xl:items-center gap-1">
                                <button
                                    onClick={() => setIsScrubbed(!isScrubbed)}
                                    className={`px-4 md:px-6 py-2 rounded-lg font-bold transition-all border text-xs md:text-base ${isScrubbed ? 'bg-slate-800 border-emerald-500 text-emerald-400' : 'bg-emerald-600 border-transparent text-white hover:bg-emerald-500'}`}
                                >
                                    {isScrubbed ? 'Reset Warden' : 'Activate Scrubbing'}
                                </button>
                                <span className="text-[9px] md:text-xs text-slate-500 uppercase font-mono">{isScrubbed ? 'Traffic: Reproducible' : 'Traffic: Dirty'}</span>
                            </div>
                        </div>
                    </div>
                </Card>
            );
        };

        // 3. Verification Hasher
        const VerificationDemo = () => {
            const [proverText, setProverText] = useState('{"prompt": "Summarize the report"}');
            const [verifierText, setVerifierText] = useState('{"prompt": "Summarize the report"}');

            const simpleHash = (str) => {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = (hash << 5) - hash + char;
                    hash = hash & hash;
                }
                return Math.abs(hash).toString(16).padStart(8, '0');
            };

            const pHash = simpleHash(proverText);
            const vHash = simpleHash(verifierText);
            const match = pHash === vHash;

            return (
                <Card title="The Replay Check" icon={CheckCircle} className="mb-8">
                    <p className="mb-6 text-slate-400 text-sm md:text-base">
                        The Verifier replays the declared workload and compares the hash of the traffic.
                        Try editing the payload below. If the Prover hides data (steganography), the traffic changes, the hash changes, and verification fails.
                    </p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="text-[10px] md:text-xs font-bold text-slate-500 uppercase">Prover (Datacenter)</label>
                            <textarea
                                value={proverText}
                                onChange={(e) => setProverText(e.target.value)}
                                className="w-full h-32 bg-slate-950 border border-slate-700 rounded-lg p-3 font-mono text-xs md:text-sm text-slate-300 focus:outline-none focus:border-blue-500 transition-colors"
                            />
                            <div className="flex items-center justify-between bg-slate-800 p-3 rounded-lg border border-slate-700">
                                <span className="text-[10px] text-slate-500">Hash Output</span>
                                <span className="font-mono text-emerald-400 font-bold text-xs md:text-sm">{pHash}</span>
                            </div>
                        </div>

                        <div className="space-y-2">
                            <label className="text-[10px] md:text-xs font-bold text-slate-500 uppercase">Verifier (Replay)</label>
                            <textarea
                                value={verifierText}
                                onChange={(e) => setVerifierText(e.target.value)}
                                className="w-full h-32 bg-slate-950 border border-slate-700 rounded-lg p-3 font-mono text-xs md:text-sm text-slate-300 focus:outline-none focus:border-blue-500 transition-colors"
                            />
                            <div className="flex items-center justify-between bg-slate-800 p-3 rounded-lg border border-slate-700">
                                <span className="text-[10px] text-slate-500">Hash Output</span>
                                <span className="font-mono text-blue-400 font-bold text-xs md:text-sm">{vHash}</span>
                            </div>
                        </div>
                    </div>

                    <div className={`mt-6 p-4 rounded-xl border flex items-center justify-center gap-3 transition-colors duration-500 ${match ? 'bg-emerald-900/20 border-emerald-800/50' : 'bg-rose-900/20 border-rose-800/50'}`}>
                        {match ? (
                            <>
                                <CheckCircle className="text-emerald-500 flex-shrink-0" size={20} />
                                <span className="text-emerald-400 font-bold text-sm md:text-lg">Verification Successful: Hashes Match</span>
                            </>
                        ) : (
                            <>
                                <AlertTriangle className="text-rose-500 flex-shrink-0" size={20} />
                                <span className="text-rose-400 font-bold text-sm md:text-lg">Mismatch Detected: Potential Covert Activity</span>
                            </>
                        )}
                    </div>
                </Card>
            );
        };

        // --- Main App ---

        const App = () => {
            return (
                <div className="max-w-5xl mx-auto px-4 md:px-6 py-12 md:py-20">

                    {/* Header */}
                    <div className="mb-12 md:mb-16 fade-in">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-900/30 text-emerald-400 border border-emerald-800/50 text-[10px] md:text-xs font-mono mb-4 md:mb-6">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            ACTIVE MONITORING PROTOCOL
                        </div>
                        <h1 className="text-3xl md:text-4xl lg:text-6xl font-extrabold text-white tracking-tight leading-tight mb-6">
                            Fingerprinting of All AI Cluster Usage <span className="text-slate-600 block text-lg md:text-2xl lg:text-3xl mt-2 font-semibold">without mutually trusted processors</span>
                        </h1>

                        {/* CTA Buttons */}
                        <div className="flex flex-wrap gap-4 mb-10">
                            <a href="https://github.com/derpyplops/warden" target="_blank" className="flex items-center gap-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-6 py-3 rounded-xl font-bold text-white transition-all shadow-xl active:scale-95">
                                <Github size={20} /> View Source Code
                            </a>
                            <a href="https://docs.google.com/document/d/1uK9qZ2vf2OeIxsG5mNF3tflkouA3EmjVXt5LIOAg0b8/edit?usp=sharing" target="_blank" className="flex items-center gap-3 bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-bold text-white transition-all shadow-xl active:scale-95 shadow-emerald-900/20 border border-emerald-500/50">
                                <FileText size={20} /> Read the Paper
                            </a>
                        </div>

                        <div className="flex flex-wrap gap-4 text-slate-400 text-xs font-mono mt-8">
                            <a href="https://nacicankaya.substack.com/" target="_blank" className="flex items-center gap-2 hover:text-emerald-400 transition-colors">
                                <div className="w-6 h-6 rounded-full bg-slate-800 flex items-center justify-center text-[10px] text-white font-bold">NC</div> Naci Cankaya
                            </a>
                            <a href="https://www.safer-ai.org/about/jakub-krys" target="_blank" className="flex items-center gap-2 hover:text-emerald-400 transition-colors">
                                <div className="w-6 h-6 rounded-full bg-slate-800 flex items-center justify-center text-[10px] text-white font-bold">JK</div> Jakub Kryś
                            </a>
                            <a href="https://www.linkedin.com/in/jonathan-ng-7061a3162/" target="_blank" className="flex items-center gap-2 hover:text-emerald-400 transition-colors">
                                <div className="w-6 h-6 rounded-full bg-slate-800 flex items-center justify-center text-[10px] text-white font-bold">JN</div> Jonathan Ng
                            </a>

                        <p className="mt-4 text-sm md:text-base text-slate-400 leading-relaxed">
