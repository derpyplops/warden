<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden: Protocol Stack Explorer</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icon = ({ size = 24, className, children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Shield = (p) => <Icon {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></Icon>;
        const Microscope = (p) => <Icon {...p}><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/></Icon>;
        const Terminal = (p) => <Icon {...p}><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></Icon>;
        const ArrowUp = (p) => <Icon {...p}><path d="m18 15-6-6-6 6"/></Icon>;
        const Layers = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></Icon>;
        const MousePointer = (p) => <Icon {...p}><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/></Icon>;

        // --- Interactive Protocol Stack Component ---

        const ProtocolStack = () => {
            const [depth, setDepth] = useState(0); // 0: Ethernet, 1: IP, 2: TCP
            const [hoveredPart, setHoveredPart] = useState(null);

            // Layer Definitions
            const layers = {
                0: {
                    title: "Layer 1: Ethernet Frame (802.3 / DIX)",
                    icon: Layers,
                    color: "text-purple-400",
                    parts: [
                        { 
                            id: 'pre', label: 'PRE/SFD', width: 10, color: 'bg-slate-400', full: 'Preamble & SFD', 
                            example: '101010...11',
                            binary: '0b10101010....10101011',
                            text: '7 bytes of alternating 1s and 0s (10101010) followed by 1 byte Start Frame Delimiter (10101011). Generated by the physical NIC to allow the receiver to lock its digital phase-locked loop (DPLL) to the sender\'s clock before data arrives.' 
                        },
                        { 
                            id: 'dst', label: 'DEST MAC', width: 15, color: 'bg-blue-400', full: 'Destination MAC Address', 
                            example: '02:00:0A:00:00:02',
                            binary: '0b00000010....00000010',
                            text: 'The physical address of the receiving interface. In Ethernet, the first 3 bytes are the OUI (Vendor ID). Locally administered addresses (02:...) ensure deterministic lab results.' 
                        },
                        { 
                            id: 'src', label: 'SRC MAC', width: 15, color: 'bg-indigo-400', full: 'Source MAC Address', 
                            example: '02:00:0A:00:00:01',
                            binary: '0b00000010....00000001',
                            text: 'The physical address of the sending interface. Switches use this to learn port associations. If this changes, ARP tables in the network must update to ensure proper routing.' 
                        },
                        { 
                            id: 'typ', label: 'TYPE', width: 10, color: 'bg-amber-400', full: 'EtherType', 
                            example: '0x0800',
                            binary: '0b0000100000000000',
                            text: 'A 16-bit identifier indicating which protocol is encapsulated in the payload. 0x0800 = IPv4, 0x0806 = ARP, 0x86DD = IPv6. This tells the OS kernel which protocol handler to invoke next.' 
                        },
                        { 
                            id: 'pay', label: 'PAYLOAD (IP)', width: 40, color: 'bg-emerald-500 animate-pulse', full: 'Encapsulated Packet', 
                            example: '[IPv4 Header + Data]',
                            binary: '0b01000101....(variable)',
                            text: 'The data carried by the frame (46-1500 bytes). If shorter than 46 bytes, padding is added. In this explorer, it contains the full IPv4 packet. Double click to drill down.', 
                            drill: 1 
                        },
                        { 
                            id: 'fcs', label: 'FCS', width: 10, color: 'bg-red-400', full: 'Frame Check Sequence', 
                            example: '0xB29A1C4E',
                            binary: '0b10110010....01001110',
                            text: 'A 32-bit Cyclic Redundancy Check (CRC). If any bit in the frame flips during transmission, the receiver\'s calculated FCS won\'t match and the frame is dropped.' 
                        },
                    ]
                },
                1: {
                    title: "Layer 2: IPv4 Header (RFC 791)",
                    icon: Microscope,
                    color: "text-emerald-400",
                    parts: [
                        { 
                            id: 'ver', label: 'VER', width: 8, color: 'bg-slate-400', full: 'Version', 
                            example: '4', 
                            binary: '0b0100',
                            text: 'Constant value 4 (0100). Essential for protocol dispatching. Version 6 (0110) would trigger the IPv6 stack.' 
                        },
                        { 
                            id: 'ihl', label: 'IHL', width: 8, color: 'bg-slate-400', full: 'Internet Header Length', 
                            example: '5', 
                            binary: '0b0101',
                            text: 'The number of 32-bit words in the header. Minimum value is 5 (20 bytes). Used to identify where the payload begins.' 
                        },
                        { 
                            id: 'tos', label: 'TOS', width: 8, color: 'bg-slate-500', full: 'Type of Service (DSCP)', 
                            example: '0x00', 
                            binary: '0b00000000',
                            text: 'Used for traffic prioritization and congestion notification. Routers use this to manage quality of service (QoS).' 
                        },
                        { 
                            id: 'len', label: 'LEN', width: 8, color: 'bg-slate-400', full: 'Total Length', 
                            example: '60 bytes', 
                            binary: '0b0000000000111100',
                            text: 'Total size of the IP packet (Header + Payload). This allows the receiver to know when the packet ends.' 
                        },
                        { 
                            id: 'id', label: 'ID (Stego)', width: 12, color: 'bg-amber-500', full: 'Identification', 
                            example: '0x3A2F', 
                            binary: '0b0011101000101111',
                            text: 'Used to identify fragments of an original packet. For atomic packets, this value is technically arbitrary. Steganography tools exploit this "Degree of Freedom" to hide secret data.', 
                            wardenAction: 'Warden randomizes this to destroy covert signals while maintaining reassembly functionality.' 
                        },
                        { 
                            id: 'flg', label: 'FLG', width: 8, color: 'bg-slate-400', full: 'Flags / Offset', 
                            example: 'DF (Don\'t Fragment)', 
                            binary: '0b0100000000000000',
                            text: 'Controls fragmentation logic. DF=1 tells routers to drop packets rather than fragmenting them if they exceed the MTU.' 
                        },
                        { 
                            id: 'ttl', label: 'TTL', width: 8, color: 'bg-slate-500', full: 'Time To Live', 
                            example: '64', 
                            binary: '0b01000000',
                            text: 'Hop limit to prevent infinite loops. Decremented by 1 at every router. If it hits 0, the packet is discarded.' 
                        },
                        { 
                            id: 'proto', label: 'PRO', width: 8, color: 'bg-amber-400', full: 'Protocol', 
                            example: '6 (TCP)', 
                            binary: '0b00000110',
                            text: 'Defines the encapsulated protocol. 6=TCP, 17=UDP, 1=ICMP. Essential for Layer 3 demultiplexing.' 
                        },
                        { 
                            id: 'src', label: 'SRC IP', width: 12, color: 'bg-indigo-400', full: 'Source IP', 
                            example: '10.0.0.1', 
                            binary: '0b00001010....00000001',
                            text: 'The 32-bit logical address of the sender. Used for routing replies back to the originator.' 
                        },
                        { 
                            id: 'dst', label: 'DST IP', width: 12, color: 'bg-blue-400', full: 'Destination IP', 
                            example: '10.0.0.2', 
                            binary: '0b00001010....00000010',
                            text: 'The 32-bit logical address of the intended receiver. Primary field for internet-wide routing decisions.' 
                        },
                        { 
                            id: 'data', label: 'DATA (TCP)', width: 16, color: 'bg-emerald-500 animate-pulse', full: 'IP Payload', 
                            example: '[TCP Segment]', 
                            binary: '0b11000000....',
                            text: 'Contains the encapsulated Layer 4 Segment. Double click to drill down.', 
                            drill: 2 
                        },
                    ]
                },
                2: {
                    title: "Layer 3: TCP Segment (RFC 793)",
                    icon: Terminal,
                    color: "text-amber-400",
                    parts: [
                        { 
                            id: 'prt', label: 'PORTS', width: 15, color: 'bg-blue-300', full: 'Src/Dst Ports', 
                            example: 'Src: 49152, Dst: 80', 
                            binary: '0b1100000000000000....',
                            text: 'Multiplexes data to specific applications. Src Port is usually ephemeral (random), while Dst Port identifies the service (e.g., 80 for HTTP).' 
                        },
                        { 
                            id: 'seq', label: 'SEQ #', width: 20, color: 'bg-amber-500', full: 'Sequence Number', 
                            example: '0x1A2B3C4D', 
                            binary: '0b00011010....01001101',
                            text: 'Tracks byte stream position for reliable delivery. The Initial Sequence Number (ISN) must be random to prevent attacks. Steganography can hide data in the ISN entropy.', 
                            wardenAction: 'Warden offsets this value to neutralize hidden data while maintaining connection integrity.' 
                        },
                        { 
                            id: 'ack', label: 'ACK', width: 10, color: 'bg-slate-400', full: 'Ack Number', 
                            example: '0x00000000', 
                            binary: '0b00000000....00000000',
                            text: 'The next sequence number expected from the peer. Valid only if the ACK flag is set in the Flags field.' 
                        },
                        { 
                            id: 'off', label: 'OFF', width: 5, color: 'bg-slate-500', full: 'Data Offset', 
                            example: '5', 
                            binary: '0b0101',
                            text: 'Header size in 32-bit words. Tells the receiver where the application payload starts.' 
                        },
                        { 
                            id: 'flg', label: 'FLAGS', width: 10, color: 'bg-slate-400', full: 'Control Flags', 
                            example: 'SYN (000000010)', 
                            binary: '0b000000010',
                            text: 'Controls the TCP state machine (SYN, ACK, FIN, RST, etc.). Essential for connection setup and teardown.' 
                        },
                        { 
                            id: 'win', label: 'WIN', width: 10, color: 'bg-slate-400', full: 'Window Size', 
                            example: '64240', 
                            binary: '0b1111101011110000',
                            text: 'Used for flow control. Indicates how many bytes the receiver is currently willing to accept into its buffer.' 
                        },
                        { 
                            id: 'sum', label: 'SUM', width: 10, color: 'bg-slate-400', full: 'Checksum', 
                            example: '0x6A12', 
                            binary: '0b0110101000010010',
                            text: 'End-to-end reliability check covering the header, data, and IP pseudo-header. If incorrect, the segment is discarded.' 
                        },
                        { 
                            id: 'pay', label: 'APP DATA', width: 20, color: 'bg-emerald-400', full: 'Application Data', 
                            example: '{"text": "hello"}', 
                            binary: '0b01111011....01111101',
                            text: 'The actual "overt" message payload (Layer 7). Examples include HTTP data, JSON objects, or file chunks.' 
                        },
                    ]
                }
            };

            const currentLayer = layers[depth];
            const LayerIcon = currentLayer.icon;

            return (
                <div className="bg-slate-900 rounded-xl border border-slate-700 p-6 shadow-xl relative overflow-hidden transition-all duration-500 h-full flex flex-col">
                     <div className="flex items-center justify-between mb-4">
                        <h3 className={`text-xl font-bold text-white flex items-center ${depth > 0 ? 'fade-in' : ''}`}>
                            <LayerIcon className={`mr-2 ${currentLayer.color}`} /> 
                            {currentLayer.title}
                        </h3>
                        {depth > 0 && (
                            <button 
                                onClick={() => { setDepth(depth - 1); setHoveredPart(null); }}
                                className="flex items-center px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-xs font-bold text-slate-300 transition-colors shadow-lg"
                            >
                                <ArrowUp size={16} className="mr-2" /> Go Up Layer
                            </button>
                        )}
                    </div>

                    {/* Interactive Bar */}
                    <div className="flex w-full mb-6 rounded-xl overflow-hidden ring-4 ring-slate-800 h-24 select-none shadow-2xl bg-black/20">
                        {currentLayer.parts.map(p => (
                            <div 
                                key={p.id}
                                onMouseEnter={() => setHoveredPart(p)}
                                onDoubleClick={() => p.drill && setDepth(p.drill)}
                                className={`flex flex-col items-center justify-center font-bold text-slate-900 transition-all ${p.color} hover:brightness-110 px-2 text-center border-r border-black/10 relative group ${p.drill ? 'cursor-pointer' : 'cursor-help'}`}
                                style={{ width: `${p.width}%` }}
                            >
                                <span className="text-[10px] md:text-xs z-10 leading-tight">{p.label}</span>
                                {p.drill && (
                                    <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-40 bg-white transition-opacity">
                                        <MousePointer size={24} />
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* Info Panel */}
                    <div className="bg-slate-800 p-6 rounded-xl min-h-[180px] transition-all border border-slate-700 relative overflow-hidden flex-1">
                        {hoveredPart ? (
                            <div className="fade-in relative z-10">
                                <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-4">
                                    <div className="space-y-1">
                                        <div className="flex items-center space-x-3">
                                            <span className="font-extrabold text-white text-2xl">{hoveredPart.full}</span>
                                            {hoveredPart.drill && <span className="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-full font-mono uppercase tracking-widest shadow-lg animate-pulse">Drill Down Available</span>}
                                        </div>
                                        <div className="font-mono text-sm text-blue-300 bg-blue-900/20 px-2 py-1 rounded inline-block">
                                            Example: <span className="text-white font-bold">{hoveredPart.example}</span>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-end">
                                        <span className="font-mono text-xs bg-black/40 px-4 py-2 rounded-lg text-emerald-400 border border-slate-700 shadow-inner">
                                            Binary: {hoveredPart.binary}
                                        </span>
                                    </div>
                                </div>
                                <div className="border-t border-slate-700 pt-4 mt-2">
                                    <p className="text-slate-300 leading-relaxed text-base">{hoveredPart.text}</p>
                                </div>
                                {hoveredPart.wardenAction && (
                                    <div className="mt-4 text-sm bg-emerald-950/40 border border-emerald-800/60 p-3 rounded-lg text-emerald-300 italic flex items-start shadow-inner">
                                        <Shield size={18} className="mr-3 mt-0.5 flex-shrink-0 text-emerald-400" />
                                        <span><strong>Active Warden Strategy:</strong> {hoveredPart.wardenAction}</span>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="text-slate-500 flex flex-col items-center justify-center h-full italic space-y-3">
                                <MousePointer size={40} className="opacity-20" />
                                <div className="text-center">
                                    <p className="text-lg">Hover over segments for detailed bit-level analysis.</p>
                                    {depth < 2 && <p className="text-emerald-500/80 mt-1 font-bold">Double-click payloads to drill down into encapsulated headers.</p>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen p-8 md:p-12 lg:p-20 flex items-center justify-center">
                        <ProtocolStack />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
